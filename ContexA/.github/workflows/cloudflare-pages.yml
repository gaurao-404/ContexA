name: Deploy ContexA frontend to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_CLOUDFLARE_PAGES_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Validate production build settings
        shell: bash
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_PAGES_PROJECT" || { echo "Missing repository variable CLOUDFLARE_PAGES_PROJECT"; exit 1; }
          test -n "$VITE_API_URL" || { echo "Missing repository variable VITE_API_URL"; exit 1; }
          case "$VITE_API_URL" in https://*) ;; *) echo "VITE_API_URL must use HTTPS in production"; exit 1 ;; esac
          test -n "$VITE_SUPABASE_URL" || { echo "Missing repository variable VITE_SUPABASE_URL"; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "VITE_SUPABASE_URL must use HTTPS"; exit 1 ;; esac
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Missing repository variable VITE_SUPABASE_PUBLISHABLE_KEY"; exit 1; }
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "VITE_SUPABASE_PUBLISHABLE_KEY must be a Supabase publishable key"; exit 1 ;; esac
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_AUTH_MODE: supabase
          VITE_SUBMISSION_MODE: 'false'
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      - name: Deploy Pages assets
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$GITHUB_REF_NAME"
